# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install APT packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libopus-dev=1.4-1build1 libopusfile-dev=0.12-4build3 git ca-certificates
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Test
      run: go test -v ./...
